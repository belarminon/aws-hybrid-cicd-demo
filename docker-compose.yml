name: aws-pet-owner-app

services:
  backend:
    container_name: pet-owner-backend
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - ENV=development

  frontend:
    container_name: pet-owner-frontend
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend